# Hiwara iOS ipa 云端构建 Workflow
# 用法：放到 fork 仓库的 .github/workflows/ 下，推送后在 Actions 页手动触发即可。
# 产物：未签名（ad-hoc 签名）的 Hiwara-unsigned.ipa，可配合 AltStore / SideStore / 爱思助手等侧载。
name: Build Hiwara iOS ipa

on:
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Disable code signing (unsigned build)
        run: |
          PBX=src-tauri/gen/apple/hiwara.xcodeproj/project.pbxproj
          echo "pbxproj: $PBX"
          sed -i '' -e 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' \
                     -e 's/CODE_SIGN_STYLE = "Automatic";/CODE_SIGN_STYLE = "Manual";/g' \
                     -e 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' \
                     -e 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' \
                     "$PBX" || true
          # 直接向工程注入 CODE_SIGNING_ALLOWED=NO（最高优先级，彻底关闭签名检查）
          sed -i '' 's/buildSettings = {/buildSettings = {\nCODE_SIGNING_ALLOWED = NO;/g' "$PBX" || true
          # 兜底：同步注入所有 xcconfig
          find src-tauri/gen/apple -name "*.xcconfig" -not -path "*/Pods/*" | while read f; do
            echo "inject no-sign into: $f"
            grep -q "CODE_SIGNING_ALLOWED" "$f" || printf "\nCODE_SIGNING_ALLOWED = NO\n" >> "$f"
          done

      - name: Configure git auth for SwiftPM
        run: |
          # SwiftPM 构建本地插件的 Swift 包时会 clone tauri-apps/tauri-plugin-ios，
          # runner 上匿名 git 请求会被 GitHub 要求认证，注入 token 认证头即可通过。
          git config --global --unset-all http.https://github.com/.extraheader || true
          git config --global --unset-all credential.helper || true
          AUTH="$(printf 'x-access-token:%s' "${{ secrets.GITHUB_TOKEN }}" | base64)"
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"

      - name: Build iOS app (arm64 device)
        run: |
          set +e
          npx tauri ios build --target aarch64
          BUILD_EXIT=$?
          set -e
          echo "tauri ios build exit code: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ] && [ $BUILD_EXIT -ne 70 ]; then
            exit $BUILD_EXIT
          fi

      - name: Locate and package IPA
        run: |
          APP=$(find src-tauri -type d -name "Hiwara.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Hiwara.app not found after build"
            exit 1
          fi
          echo "App found: $APP"
          codesign --force --deep --sign - "$APP" || true
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Hiwara-unsigned.ipa Payload
          ls -lh Hiwara-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hiwara-ios-unsigned-ipa
          path: Hiwara-unsigned.ipa
          if-no-files-found: error

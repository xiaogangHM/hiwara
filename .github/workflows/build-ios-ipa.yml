name: Build Hiwara iOS ipa

on:
  workflow_dispatch:

jobs:
  build-ios-ipa:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Initialize iOS project
        run: npx tauri ios init

      - name: Disable code signing (unsigned build)
        run: |
          cd src-tauri/gen/apple
          PBX=$(find . -name "project.pbxproj" -not -path "*/Pods/*" | head -1)
          echo "pbxproj: $PBX"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX" || true
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' "$PBX" || true
          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;/DEVELOPMENT_TEAM = "";/g' "$PBX" || true

      - name: Build iOS app (arm64 device)
        run: |
          set +e
          npx tauri ios build --target aarch64
          BUILD_EXIT=$?
          set -e
          echo "tauri ios build exit code: $BUILD_EXIT"
          if [ $BUILD_EXIT -ne 0 ] && [ $BUILD_EXIT -ne 70 ]; then
            exit $BUILD_EXIT
          fi

      - name: Locate and package IPA
        run: |
          APP=$(find src-tauri -type d -name "Hiwara.app" | head -1)
          if [ -z "$APP" ]; then
            echo "::error::Hiwara.app not found after build"
            exit 1
          fi
          echo "App found: $APP"
          codesign --force --deep --sign - "$APP" || true
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Hiwara-unsigned.ipa Payload
          ls -lh Hiwara-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hiwara-ios-unsigned-ipa
          path: Hiwara-unsigned.ipa
          if-no-files-found: error
